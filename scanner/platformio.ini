; PlatformIO Project Configuration for ESP32-S3 USB Barcode Scanner Emulator
; Phase 1: Native USB HID Keyboard Engine

[platformio]
default_envs = esp32s3_generic
src_dir = src
include_dir = include

; Shared ESP32-S3 settings (a named section, not [env], so the native test
; environment below doesn't inherit the ESP32 platform and framework)
[esp32s3_base]
platform = espressif32 @ ^6.5.0
framework = arduino
monitor_speed = 115200

; Native USB OTG Configuration. The board JSONs pass -DARDUINO_USB_MODE=1
; (HW CDC/JTAG); unflag it so TinyUSB OTG mode (needed for HID) always wins.
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -D ARDUINO_USB_MODE=0            ; 0 = Native USB OTG mode (TinyUSB)
    -D ARDUINO_USB_CDC_ON_BOOT=1     ; 1 = Enable USB CDC serial alongside HID
    -D CORE_DEBUG_LEVEL=3            ; Info logging level

; ----------------------------------------------------------------------
; Profile A: Generic EDP Scanner Emulator (Default)
; ----------------------------------------------------------------------
[env:esp32s3_generic]
extends = esp32s3_base
board = esp32-s3-devkitc-1
build_flags =
    ${esp32s3_base.build_flags}
    -D SCANNER_PROFILE=0

; ----------------------------------------------------------------------
; Profile B: Honeywell Xenon 1900 Scanner Spoof
; ----------------------------------------------------------------------
[env:esp32s3_honeywell]
extends = esp32s3_base
board = esp32-s3-devkitc-1
build_flags =
    ${esp32s3_base.build_flags}
    -D SCANNER_PROFILE=1

; ----------------------------------------------------------------------
; Profile C: Zebra DS2208 Scanner Spoof
; ----------------------------------------------------------------------
[env:esp32s3_zebra]
extends = esp32s3_base
board = esp32-s3-devkitc-1
build_flags =
    ${esp32s3_base.build_flags}
    -D SCANNER_PROFILE=2

; ----------------------------------------------------------------------
; Compact Board: Seeed Studio XIAO ESP32-S3
; ----------------------------------------------------------------------
[env:seeed_xiao_esp32s3]
extends = esp32s3_base
board = seeed_xiao_esp32s3
build_flags =
    ${esp32s3_base.build_flags}
    -D SCANNER_PROFILE=0
    -D BOARD_SEEED_XIAO=1

; ----------------------------------------------------------------------
; Host unit tests for include/payload_rules.h (no hardware needed)
;   pio test -e native
; ----------------------------------------------------------------------
[env:native]
platform = native
test_build_src = no
build_flags = -std=c++11 -Wall -Wextra
